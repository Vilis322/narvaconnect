services:
  postgres:
    image: postgres:16-alpine
    container_name: narvaconnect-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narvaconnect}
      POSTGRES_USER: ${POSTGRES_USER:-narva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narva_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-narva}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
